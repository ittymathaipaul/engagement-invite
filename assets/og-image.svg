<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7a0015"/>
      <stop offset="100%" stop-color="#2e0008"/>
    </linearGradient>
    <!-- Gold shimmer on frame -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#c9a84c"/>
      <stop offset="40%"  stop-color="#f0d080"/>
      <stop offset="60%"  stop-color="#f0d080"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <!-- Inner frame gradient -->
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#b8922f"/>
      <stop offset="50%"  stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#b8922f"/>
    </linearGradient>
    <!-- Soft glow behind names -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#960018" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2e0008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle noise texture overlay -->
  <rect width="1200" height="630" fill="#960018" opacity="0.08"/>

  <!-- Outer decorative border -->
  <rect x="28" y="28" width="1144" height="574" rx="4" ry="4"
        fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner decorative border -->
  <rect x="44" y="44" width="1112" height="542" rx="2" ry="2"
        fill="none" stroke="url(#gold2)" stroke-width="0.75" opacity="0.5"/>

  <!-- Corner ornaments — top-left -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.75">
    <line x1="28" y1="80"  x2="28"  y2="28"/>
    <line x1="28" y1="28"  x2="80"  y2="28"/>
    <line x1="44" y1="90"  x2="44"  y2="44"/>
    <line x1="44" y1="44"  x2="90"  y2="44"/>
    <circle cx="28" cy="28" r="4" fill="url(#gold)" stroke="none"/>
  </g>
  <!-- Corner ornaments — top-right -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.75">
    <line x1="1172" y1="80"  x2="1172" y2="28"/>
    <line x1="1172" y1="28"  x2="1120" y2="28"/>
    <line x1="1156" y1="90"  x2="1156" y2="44"/>
    <line x1="1156" y1="44"  x2="1110" y2="44"/>
    <circle cx="1172" cy="28" r="4" fill="url(#gold)" stroke="none"/>
  </g>
  <!-- Corner ornaments — bottom-left -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.75">
    <line x1="28" y1="550" x2="28"  y2="602"/>
    <line x1="28" y1="602" x2="80"  y2="602"/>
    <line x1="44" y1="540" x2="44"  y2="586"/>
    <line x1="44" y1="586" x2="90"  y2="586"/>
    <circle cx="28" cy="602" r="4" fill="url(#gold)" stroke="none"/>
  </g>
  <!-- Corner ornaments — bottom-right -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.75">
    <line x1="1172" y1="550" x2="1172" y2="602"/>
    <line x1="1172" y1="602" x2="1120" y2="602"/>
    <line x1="1156" y1="540" x2="1156" y2="586"/>
    <line x1="1156" y1="586" x2="1110" y2="586"/>
    <circle cx="1172" cy="602" r="4" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Centre glow -->
  <ellipse cx="600" cy="315" rx="400" ry="240" fill="url(#glow)"/>

  <!-- Top label -->
  <text x="600" y="148" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" letter-spacing="8" fill="#e8c96a" opacity="0.85"
        font-weight="400">
    JOYFULLY ANNOUNCING OUR
  </text>

  <!-- Decorative rule with diamond -->
  <line x1="200" y1="166" x2="530" y2="166" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
  <polygon points="600,159 608,166 600,173 592,166" fill="#e8c96a" opacity="0.8"/>
  <line x1="670" y1="166" x2="1000" y2="166" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>

  <!-- ENGAGEMENT wordmark -->
  <text x="600" y="240" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" letter-spacing="18" fill="url(#gold)"
        font-weight="400">
    ENGAGEMENT
  </text>

  <!-- Couple names -->
  <text x="600" y="340" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58" fill="#fff8f0" font-weight="300" font-style="italic"
        letter-spacing="2">
    Ittymathew
  </text>

  <!-- Ampersand -->
  <text x="600" y="390" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" fill="#e8c96a" opacity="0.9" letter-spacing="20">
    &amp;
  </text>

  <!-- Second name -->
  <text x="600" y="452" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58" fill="#fff8f0" font-weight="300" font-style="italic"
        letter-spacing="2">
    Rosemary
  </text>

  <!-- Decorative rule below names -->
  <line x1="280" y1="478" x2="520" y2="478" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
  <circle cx="600" cy="478" r="3.5" fill="#e8c96a" opacity="0.8"/>
  <line x1="680" y1="478" x2="920" y2="478" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Date -->
  <text x="600" y="520" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" letter-spacing="6" fill="#e8c96a" opacity="0.9"
        font-weight="400">
    SATURDAY  ·  APRIL 11, 2026
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="572" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12" letter-spacing="4" fill="#c9a84c" opacity="0.6">
    engagement.ittywedsrose.love
  </text>
</svg>
